# AIVES - application PostgreSQL, pgAdmin, and Keycloak for local development
# Start:     docker compose up -d        (first start runs database/01_schema.sql, then 02_seed.sql)
# Reset DB:  docker compose down -v && docker compose up -d   (drops the volume -> scripts run again)
services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-only}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/aives-realm.json:/opt/keycloak/data/import/aives-realm.json:ro
    depends_on:
      mailpit:
        condition: service_started
      keycloak-db:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: aives-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aives
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives@123
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in ./database run once, in file-name order, only when the volume is empty
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aives-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aives.edu.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  faster-whisper:
    profiles: ["local-ai"]
    build:
      context: ./local-ai/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      HF_HOME: /models/huggingface
      MODEL_CACHE: /models
      MAX_AUDIO_BYTES: 15728640
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  piper-tts:
    profiles: ["local-ai"]
    build:
      context: ./local-ai/tts
    restart: unless-stopped
    environment:
      PIPER_VOICES_DIR: /voices
      PIPER_VI_VOICE: vi_VN-vais1000-medium
      PIPER_EN_VOICE: en_US-lessac-medium
      MAX_TEXT_CHARS: 10000
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
  keycloak-data:
  whisper-models:
  piper-voices:
